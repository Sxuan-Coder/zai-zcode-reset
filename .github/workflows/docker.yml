# 自动构建 Docker 镜像并发布到 Docker Hub
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置两个 secret：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub → Account Settings → Security → Personal access tokens（Read & Write）
#
# 触发规则：
#   push 正式版 vX.Y.Z      → 发布 :vX.Y.Z、:X.Y 和 :latest（例：git tag v0.2.0 && git push --tags）
#   push 预览版 vX.Y.Z-*    → 只发布 :vX.Y.Z-*（如 v0.3.0-beta.1、-rc.1），不动 :latest
#   手动触发           → 按当前分支发布
#   push 到 main 等普通推送不触发构建，发版必须打标签
name: Docker 发布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 QEMU（arm64 交叉构建需要）
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 判断是否正式版（预发布标签不打 :latest）
        id: rel
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/zai-zcode-reset
          flavor: |
            latest=${{ steps.rel.outputs.stable }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 构建并推送（linux/amd64 + linux/arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
